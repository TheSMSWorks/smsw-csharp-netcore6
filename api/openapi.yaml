    OTP:
      description: Parameters for the generation and sending of One-Time Passwords
      example:
        template: "This is your one-time passcode - {{passcode}}"
        metadata:
          customer_id: ABC123
          cart_id: XYZ789
        sender: YourCompany
        destination: "7777777777"
        length: "{}"
        validity: 300
        passcode: "123456"
      properties:
        sender:
          description: The sender of the message. Should be no longer than 11 characters
            for alphanumeric or 15 characters for numeric sender ID's. No spaces or
            special characters.
          example: YourCompany
          type: string
        destination:
          description: The phone number of the recipient.
          example: "7777777777"
          type: string
        length:
          description: "The length of the generated passcode. The default length is\
            \ 6 characters, which will apply if this parameter is omitted. All generated\
            \ passcodes are numeric. Optional."
          type: object
        template:
          description: "A template to use as the content for the message. You must\
            \ include the '{{passcode}}' placeholder, which will be replaced by the\
            \ generated passcode when the message is sent. Optional."
          example: "This is your one-time passcode - {{passcode}}"
          type: string
        validity:
          description: The length of time in seconds for which the generated passcode
            should be valid. Optional.
          example: 300
          type: number
        passcode:
          description: A passcode you supply for use in the message template. This
            will be stored on the OTP record in our system for later verification.
            Optional.
          example: "123456"
          type: string
        metadata:
          description: "A JSON object of no longer than 1024 bytes, containing as\
            \ many parameters as you wish, to store data for use in your application.\
            \ This will be returned when you verify the passcode."
          example:
            customer_id: ABC123
            cart_id: XYZ789
          properties: {}
          type: object
      type: object
    OTPResponse:
      description: Response schema for the /otp/send method
      example:
        credits: 561
        messageparts: 1
        messageid: 52692416-ce9e-45ad-aa1e-14fcee8fa662
        status: SENT
        creditsUsed: 1
      properties:
        messageid:
          description: The messageid of the SMS used to send the OTP. Save this in
            your application to use when verifying passcodes.
          example: 52692416-ce9e-45ad-aa1e-14fcee8fa662
          type: string
        status:
          description: The initial status of the OTP message.
          example: SENT
          type: string
        credits:
          description: The credit balance on your account
          example: 561
          type: number
        creditsUsed:
          description: The number of credits used to send this message
          example: 1
          type: number
        messageparts:
          description: The number of message parts used to send this message
          example: 1
          type: number
      type: object
    OTPVerify:
      description: Schema for the /oyp/verify method
      example:
        passcode: "123456"
      properties:
        passcode:
          description: One-Time Passcode submitted to your application
          example: "123456"
          type: string
      type: object
    OTPVerifyResponse:
      description: Response schema for the /otp/verify method
      example:
        metadata:
          customer_id: ABC123
          cart_id: XYZ789
        expires: Tue Apr 25 2023 16:57:00 GMT+0100 (British Summer Time)
        created: Tue Apr 25 2023 16:47:00 GMT+0100 (British Summer Time)
        destination: "447777000000"
        modified: Tue Apr 25 2023 16:49:20 GMT+0100 (British Summer Time)
        validity: 300
        passcode: 123456
        status: VERIFIED
      properties:
        destination:
          description: The mobile number that the OTP was sent to
          example: "447777000000"
          type: string
        status:
          description: "The status of the OTP. If the passcode is used within the\
            \ validity period then this will be 'VERIFIED', otherwise it will be 'EXPIRED'"
          example: VERIFIED
          type: string
        passcode:
          description: The passcode used.
          example: 123456
          type: number
        validity:
          description: The length of time in seconds for which the generated passcode
            is valid.
          example: 300
          type: number
        metadata:
          description: "A JSON object storing data supplied when this passcode was\
            \ generated, for use in your application."
          example:
            customer_id: ABC123
            cart_id: XYZ789
          properties: {}
          type: object
        created:
          description: The ISO 8601 date/time at which this OTP was created
          example: Tue Apr 25 2023 16:47:00 GMT+0100 (British Summer Time)
          type: string
        expires:
          description: The ISO 8601 date/time at which this OTP expires
          example: Tue Apr 25 2023 16:57:00 GMT+0100 (British Summer Time)
          type: string
        modified:
          description: The ISO 8601 date/time at which this OTP was modified (typically
            when it was verified)
          example: Tue Apr 25 2023 16:49:20 GMT+0100 (British Summer Time)
          type: string
      type: object
    ErrorModel:
      example:
        message: message
      properties:
        message:
          type: string
      required:
      - message
      type: object
    ExtendedErrorModel:
      allOf:
      - $ref: '#/components/schemas/ErrorModel'
