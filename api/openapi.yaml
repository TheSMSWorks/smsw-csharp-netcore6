  /binary/send:
    post:
      description: Sends an SMS Message in Binary format. This can be used to send
        files and data to devices that process binary content. Especially useful for
        Internet of Things (IoT). Message content should be encoded in hex pairs (e.g.
        '65 54 74 73 6d 20 73 65 61 73 65 67 2e')
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
        description: Message properties
        required: true
      responses:
        "201":
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
          description: Success
        "402":
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ExtendedErrorModel'
          description: Error
        default:
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ExtendedErrorModel'
          description: Error
      security:
      - JWT: []
      summary: Send a binary SMS message
      tags:
      - Messages
      x-codegen-request-body-name: smsMessage
  /messages:
